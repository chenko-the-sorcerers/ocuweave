[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocuweave"
version = "0.1.1"
description = "Research scaffold for evidence-grounded ophthalmic vision-language learning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Marchel Andrian Shevchenko"}]
dependencies = []

[project.urls]
Repository = "https://github.com/chenko-the-sorcerers/ocuweave"

[tool.setuptools.packages.find]
where = ["src"]
