name: Infrastructure checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-native -j2
      - run: ctest --test-dir build-native --output-on-failure
      - run: ./build-native/ocuweave-lqnet --synthetic true --output /tmp/native-demo --width 4 --dim 8 --queries 2 --steps 30
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[research]"
      - run: python scripts/check_release.py
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python -m unittest discover -s tests -v
        env:
          OCUWEAVE_NATIVE_LIBRARY: ${{ github.workspace }}/build/libocuweave_native.so
      - run: python scripts/audit_data.py examples/synthetic_manifest.json
      - name: Build and exercise an installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install wheel
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
          python -m venv --system-site-packages "$RUNNER_TEMP/ocuweave-wheel"
          "$RUNNER_TEMP/ocuweave-wheel/bin/python" -m pip install --no-deps --force-reinstall dist/ocuweave-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ocuweave-wheel/bin/ocuweave" --version
          "$RUNNER_TEMP/ocuweave-wheel/bin/ocuweave" demo --output "$RUNNER_TEMP/ocuweave-demo" --device cpu
          "$RUNNER_TEMP/ocuweave-wheel/bin/python" -c "import ocuweave; assert 'site-packages' in ocuweave.__file__, ocuweave.__file__"
          "$RUNNER_TEMP/ocuweave-wheel/bin/ocuweave" doctor
          "$RUNNER_TEMP/ocuweave-wheel/bin/ocuweave" demo-tasks --output "$RUNNER_TEMP/ocuweave-task-demo" --device cpu
          "$RUNNER_TEMP/ocuweave-wheel/bin/ocuweave" demo-multimodal --output "$RUNNER_TEMP/ocuweave-evidence-demo"
